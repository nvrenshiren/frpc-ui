name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every main/tag push; only superseded PR checks are cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/release.test.mjs
      - name: Validate version and plan release
        id: release
        run: node scripts/release.mjs plan

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rust-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-linux-
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked -p frpc-core -p frpc-versions
      - run: cargo +stable clippy --locked -p frpc-core -p frpc-versions --all-targets -- -D warnings

  windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust checks
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            ~/AppData/Local/tauri
          key: rust-windows-${{ hashFiles('Cargo.lock', 'apps/desktop/package-lock.json') }}
          restore-keys: rust-windows-
      - run: npm ci
      - run: npm test
      - name: Rust tests
        run: cargo +stable test --locked --workspace
      - name: Desktop Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Prepare Tauri build version
        run: node ../../scripts/release.mjs prepare
      - name: Build executable and NSIS installer
        run: npm run desktop:build -- --ci --config ../../artifacts/tauri-release.json -- --locked
      - name: Verify executable version
        shell: pwsh
        run: |
          $plan = Get-Content ../../artifacts/release-plan.json -Raw | ConvertFrom-Json
          $version = (Get-Item ../../target/release/frpc-ui-desktop.exe).VersionInfo.ProductVersion
          if ($version -ne $plan.version) { throw "Executable version mismatch: $version / $($plan.version)" }
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function Find-WebViewRuntime {
            foreach ($key in $runtimeKeys) {
              $version = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($version -and [version]$version -gt [version]'0.0.0.0') { return $version }
            }
          }
          if (-not (Find-WebViewRuntime)) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
              throw 'WebView2 bootstrapper signature is invalid.'
            }
            $install = Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -Wait -PassThru -WindowStyle Hidden
            if ($install.ExitCode -ne 0) { throw "WebView2 install failed: $($install.ExitCode)" }
          }
          $runtime = Find-WebViewRuntime
          if (-not $runtime) { throw 'WebView2 Runtime is unavailable.' }
          Write-Output "WebView2 Runtime: $runtime"
      - name: Release startup and IPC smoke
        run: npm run test:desktop:smoke
      - name: Package release assets and checksums
        run: node ../../scripts/release.mjs package
      - name: Verify packaged portable executable
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem ../../artifacts/release -Filter '*-windows-x64.exe')
          if ($assets.Count -ne 1) { throw 'Expected exactly one portable executable.' }
          npm run test:desktop:smoke -- $assets[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable smoke failed.' }
      - name: NSIS fresh installation smoke
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem ../../artifacts/release -Filter '*-windows-x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'frpc-ui-install-smoke'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S',"/D=$installDirectory" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)" }
          $installedExe = Join-Path $installDirectory 'frpc-ui-desktop.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'Installed executable is missing.' }
          npm run test:desktop:smoke -- $installedExe
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable smoke failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frpc-ui-windows-${{ needs.plan.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, core, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frpc-ui-windows-${{ needs.plan.outputs.version }}
          path: release
      - name: Verify release payload
        working-directory: release
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS.txt
          node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync("release.json", "utf8")); if (manifest.version !== process.env.RELEASE_VERSION || manifest.sourceSha !== process.env.GITHUB_SHA) throw new Error("Release manifest mismatch");'
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            if test "$(cat "$RUNNER_TEMP/release-draft")" = false; then
              gh release download "$RELEASE_TAG" --pattern release.json --dir "$RUNNER_TEMP/published-release"
              node --input-type=module -e 'import fs from "node:fs"; const manifest = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/published-release/release.json", "utf8")); if (manifest.sourceSha !== process.env.GITHUB_SHA) throw new Error("Published release source mismatch");'
              echo 'This commit is already published; existing assets are preserved.'
              exit 0
            fi
          else
            args=(--draft --title "frpc-ui $RELEASE_TAG" --notes-file release-notes.md --target "$GITHUB_SHA")
            if test "$RELEASE_PRERELEASE" = true; then
              args+=(--prerelease --latest=false)
            else
              args+=(--verify-tag --latest)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.exe SHA256SUMS.txt release.json --clobber
          latest=true
          if test "$RELEASE_PRERELEASE" = true; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$latest" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
